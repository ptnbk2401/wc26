<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#080d18">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>WC 2026</title>
<style>
/* ── TOKENS ─────────────────────────────────────────────── */
:root {
  --bg:       #080d18;
  --s1:       #0f1626;   /* card surface */
  --s2:       #172035;   /* elevated / input */
  --s3:       #1e2b42;   /* hover / selected */
  --gold:     #c8981f;
  --gold-hi:  #e8b535;
  --gold-bg:  rgba(200,152,31,.12);
  --red:      #d94040;
  --red-bg:   rgba(217,64,64,.12);
  --green:    #18a05a;
  --green-bg: rgba(24,160,90,.12);
  --text:     #eef2ff;
  --text2:    #7d90b0;
  --text3:    #4d607a;
  --border:   #1a2840;
  --nav-h:    58px;
  --hdr-h:    52px;
  --safe-b:   env(safe-area-inset-bottom, 0px);
}

/* ── RESET ──────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; }
body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', system-ui, sans-serif;
  font-size: 14px;
  line-height: 1.4;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}

/* ── HEADER ─────────────────────────────────────────────── */
/* Flat dark surface — no gradient. Gold stripe at bottom. */
.hdr {
  position: fixed; top: 0; left: 0; right: 0;
  height: var(--hdr-h);
  background: var(--s1);
  border-bottom: 1px solid var(--border);
  box-shadow: 0 1px 0 rgba(200,152,31,.18);
  display: flex; align-items: center;
  padding: 0 16px; z-index: 100; gap: 10px;
}
.hdr-logo { font-size: 22px; line-height: 1; flex-shrink: 0; }
.hdr-title {
  font-size: 15px; font-weight: 700;
  letter-spacing: -.2px; color: var(--text);
}
.hdr-sub {
  font-size: 10px; font-weight: 500;
  color: var(--text2); letter-spacing: .4px;
  margin-top: 1px;
}
.hdr-live {
  margin-left: auto; display: none;
  align-items: center; gap: 5px;
  font-size: 11px; font-weight: 700; color: var(--red);
  letter-spacing: .5px;
}
.hdr-live-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--red); animation: blink 1.2s ease infinite;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }

/* ── CONTENT ─────────────────────────────────────────────── */
.content {
  padding-top: calc(var(--hdr-h) + 4px);
  padding-bottom: calc(var(--nav-h) + var(--safe-b) + 8px);
  min-height: 100vh;
}

/* ── BOTTOM NAV ──────────────────────────────────────────── */
/* SVG icons, no emoji. Indicator is a 2px line, not a dot. */
.nav {
  position: fixed; bottom: 0; left: 0; right: 0;
  height: calc(var(--nav-h) + var(--safe-b));
  background: var(--s1);
  border-top: 1px solid var(--border);
  display: flex; z-index: 100;
}
.nav-btn {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 4px; cursor: pointer; color: var(--text3);
  transition: color .15s; padding-bottom: var(--safe-b);
  position: relative;
}
.nav-btn.active { color: var(--gold); }
.nav-btn.active::before {
  content: ''; position: absolute;
  top: 0; left: 50%; transform: translateX(-50%);
  width: 28px; height: 2px;
  background: var(--gold); border-radius: 0 0 2px 2px;
}
.nav-btn svg { width: 20px; height: 20px; stroke-width: 1.8; }
.nav-lbl { font-size: 10px; font-weight: 600; letter-spacing: .3px; }

/* ── TABS ────────────────────────────────────────────────── */
.tab { display: none; }
.tab.active { display: block; }

/* ── CHIPS (round filter pills) ─────────────────────────── */
.chips {
  display: flex; gap: 6px; overflow-x: auto;
  padding: 10px 16px 4px; scrollbar-width: none;
}
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex-shrink: 0;
  padding: 6px 14px; border-radius: 4px;
  border: 1px solid var(--border); background: transparent;
  font-size: 12px; font-weight: 600; color: var(--text2);
  cursor: pointer; white-space: nowrap; transition: all .12s;
}
.chip.active {
  background: var(--gold-bg);
  border-color: rgba(200,152,31,.4);
  color: var(--gold-hi);
}

/* ── SECTION LABEL ───────────────────────────────────────── */
.lbl {
  font-size: 11px; font-weight: 700; color: var(--text2);
  text-transform: uppercase; letter-spacing: 1px;
  padding: 14px 16px 6px;
  display: flex; align-items: center; gap: 8px;
}
.lbl::before {
  content: ''; display: block;
  width: 3px; height: 12px; background: var(--gold);
  border-radius: 2px; flex-shrink: 0;
}

/* ── MATCH CARD ──────────────────────────────────────────── */
/* Single flowing card, no sub-bands. */
.mc {
  margin: 0 12px 8px;
  background: var(--s1);
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
  cursor: pointer;
  transition: border-color .15s;
}
.mc:active { opacity: .85; }
.mc.is-live { border-left: 3px solid var(--red); }
.mc.is-finished { border-left: 3px solid var(--green); }

/* top meta row */
.mc-meta {
  display: flex; align-items: center;
  padding: 8px 12px 0;
  gap: 8px;
}
.mc-group {
  font-size: 10px; font-weight: 700; color: var(--gold);
  text-transform: uppercase; letter-spacing: .6px;
}
.mc-status { display: flex; align-items: center; gap: 4px; font-size: 10px; font-weight: 600; }
.mc-status-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.mc-status.upcoming .mc-status-dot { background: var(--text3); }
.mc-status.upcoming { color: var(--text2); }
.mc-status.live .mc-status-dot { background: var(--red); animation: blink 1.2s infinite; }
.mc-status.live { color: var(--red); }
.mc-status.finished .mc-status-dot { background: var(--green); }
.mc-status.finished { color: var(--green); }
.mc-time { margin-left: auto; font-size: 10px; color: var(--text2); font-variant-numeric: tabular-nums; }

/* teams + score row */
.mc-body { padding: 10px 12px 10px; }
.mc-row {
  display: grid;
  grid-template-columns: 1fr 72px 1fr;
  align-items: center; gap: 8px;
}
.mc-team {
  display: flex; flex-direction: column;
  align-items: center; gap: 5px;
}
.mc-team:last-child { /* away — mirror */ }
.mc-flag { font-size: 28px; line-height: 1; }
.mc-name {
  font-size: 12px; font-weight: 600; color: var(--text);
  text-align: center; line-height: 1.2;
  max-width: 76px;
}
.mc-score-box {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
}
.mc-score {
  font-size: 30px; font-weight: 800; line-height: 1;
  letter-spacing: -1px; color: var(--text);
  font-variant-numeric: tabular-nums;
  display: flex; align-items: center; gap: 4px;
}
.mc-score-sep { font-size: 20px; color: var(--text3); font-weight: 300; }
.mc-vs { font-size: 11px; font-weight: 700; color: var(--text3); letter-spacing: 1px; }

/* bottom footer */
.mc-foot {
  display: flex; align-items: center; justify-content: space-between;
  padding: 7px 12px 9px;
  border-top: 1px solid var(--border);
}
.mc-preds { font-size: 11px; color: var(--text2); display: flex; align-items: center; gap: 4px; }
.mc-preds-icon { font-size: 12px; }
.btn-pred {
  font-size: 12px; font-weight: 700; color: var(--gold);
  background: var(--gold-bg); border: 1px solid rgba(200,152,31,.25);
  border-radius: 4px; padding: 5px 12px; cursor: pointer;
  transition: background .12s;
}
.btn-pred:active { background: rgba(200,152,31,.22); }

/* ── STANDINGS ───────────────────────────────────────────── */
.grp-grid {
  display: grid; grid-template-columns: repeat(6,1fr);
  gap: 6px; padding: 8px 16px;
}
.grp-btn {
  height: 36px; border-radius: 4px;
  border: 1px solid var(--border); background: transparent;
  font-size: 13px; font-weight: 700; color: var(--text2);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: all .12s;
}
.grp-btn.active {
  background: var(--gold-bg); border-color: rgba(200,152,31,.4); color: var(--gold-hi);
}
.grp-btn:active { transform: scale(.93); }

.std-wrap {
  background: var(--s1); border: 1px solid var(--border);
  border-radius: 8px; margin: 4px 12px 8px; overflow: hidden;
}
.std-head {
  padding: 10px 14px 8px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: baseline; gap: 6px;
}
.std-head-group { font-size: 13px; font-weight: 800; color: var(--gold); }
.std-head-flags { font-size: 16px; letter-spacing: 2px; }

table.std { width: 100%; border-collapse: collapse; }
table.std th {
  font-size: 9px; font-weight: 700; color: var(--text3);
  text-align: center; padding: 7px 6px 5px;
  text-transform: uppercase; letter-spacing: .5px;
}
table.std th:first-child { text-align: left; padding-left: 14px; }
table.std td {
  font-size: 12px; text-align: center;
  padding: 10px 6px; border-top: 1px solid var(--border);
  color: var(--text2);
}
table.std td:first-child { text-align: left; padding-left: 0; }
table.std td:last-child { color: var(--text); font-weight: 800; font-size: 13px; }

.std-pos { display: flex; align-items: center; }
.std-bar {
  width: 3px; align-self: stretch; flex-shrink: 0;
  margin-right: 10px; border-radius: 0;
}
.std-bar.q  { background: var(--green); }
.std-bar.b3 { background: var(--gold); }
.std-bar.out{ background: var(--border); }
.std-team { display: flex; align-items: center; gap: 7px; }
.std-flag { font-size: 16px; }
.std-name { font-size: 12px; font-weight: 600; color: var(--text); }

.std-legend {
  display: flex; gap: 12px; padding: 8px 16px 12px; flex-wrap: wrap;
}
.std-leg-item { display: flex; align-items: center; gap: 5px; font-size: 10px; color: var(--text2); }
.std-leg-dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }

/* ── PREDICTION TAB ──────────────────────────────────────── */
.pred-wrap { padding: 8px 12px 0; }

.info-card {
  background: var(--s1); border: 1px solid var(--border);
  border-radius: 8px; padding: 14px; margin-bottom: 12px;
}
.info-card h3 { font-size: 14px; font-weight: 700; margin-bottom: 6px; }
.info-card p  { font-size: 12px; color: var(--text2); line-height: 1.6; }

.field { margin-bottom: 14px; }
.field-label {
  display: block; font-size: 11px; font-weight: 700;
  color: var(--text2); text-transform: uppercase;
  letter-spacing: .5px; margin-bottom: 6px;
}
.inp {
  width: 100%; background: var(--s2); border: 1px solid var(--border);
  border-radius: 6px; padding: 13px 14px; color: var(--text); font-size: 14px;
  outline: none; -webkit-appearance: none; appearance: none;
  transition: border-color .12s;
}
.inp:focus { border-color: rgba(200,152,31,.5); }
select.inp { cursor: pointer; }

.match-preview {
  background: var(--s2); border-radius: 6px;
  padding: 10px 14px; margin-bottom: 14px;
  display: flex; align-items: center; justify-content: space-between;
}
.mp-team { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; }
.mp-team.away { flex-direction: row-reverse; }
.mp-vs { font-size: 11px; color: var(--text2); font-weight: 700; }

.score-row { display: grid; grid-template-columns: 1fr 28px 1fr; align-items: center; gap: 8px; }
.score-inp {
  width: 100%; background: var(--s2); border: 1px solid var(--border);
  border-radius: 6px; padding: 14px 8px; color: var(--text);
  font-size: 26px; font-weight: 800; text-align: center;
  outline: none; -webkit-appearance: none; -moz-appearance: textfield; appearance: none;
  font-variant-numeric: tabular-nums; transition: border-color .12s;
}
.score-inp:focus { border-color: rgba(200,152,31,.5); }
.score-inp::-webkit-inner-spin-button,
.score-inp::-webkit-outer-spin-button { -webkit-appearance: none; }
.score-div { text-align: center; font-size: 18px; color: var(--text3); font-weight: 300; }

.btn-submit {
  width: 100%; background: var(--gold); color: #050a10;
  border: none; border-radius: 6px; padding: 15px;
  font-size: 14px; font-weight: 800; cursor: pointer;
  letter-spacing: .2px; transition: background .12s;
}
.btn-submit:active { background: var(--gold-hi); }

/* prediction items */
.pi {
  display: flex; align-items: center; gap: 10px;
  background: var(--s1); border: 1px solid var(--border);
  border-radius: 8px; padding: 11px 13px; margin-bottom: 8px;
}
.pi-av {
  width: 34px; height: 34px; border-radius: 50%;
  background: var(--s2); display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 800; color: var(--gold); flex-shrink: 0;
}
.pi-info { flex: 1; min-width: 0; }
.pi-name { font-size: 13px; font-weight: 700; }
.pi-match { font-size: 11px; color: var(--text2); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pi-right { text-align: right; flex-shrink: 0; }
.pi-score { font-size: 18px; font-weight: 800; color: var(--gold); font-variant-numeric: tabular-nums; }
.pi-verdict { font-size: 10px; font-weight: 700; margin-top: 2px; }
.pi-verdict.correct { color: var(--green); }
.pi-verdict.partial  { color: var(--gold); }
.pi-verdict.wrong    { color: var(--red); }
.pi-verdict.pending  { color: var(--text3); }

/* ── MODAL ───────────────────────────────────────────────── */
.overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.7);
  z-index: 200; backdrop-filter: blur(4px);
  display: flex; align-items: flex-end;
}
.overlay.hidden { display: none; }
.sheet {
  background: var(--s1); border-radius: 14px 14px 0 0;
  width: 100%; max-height: 88vh; overflow-y: auto;
  padding-bottom: calc(16px + var(--safe-b));
}
.sheet-handle {
  width: 32px; height: 3px; border-radius: 2px;
  background: var(--border); margin: 12px auto 10px;
}
.sheet-hdr {
  display: flex; align-items: center;
  padding: 0 16px 12px; border-bottom: 1px solid var(--border);
}
.sheet-title { font-size: 15px; font-weight: 800; flex: 1; }
.sheet-close {
  background: var(--s2); border: none; color: var(--text2);
  width: 28px; height: 28px; border-radius: 50%;
  font-size: 14px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.sheet-body { padding: 14px 16px; }

.modal-score-row {
  display: flex; align-items: center; justify-content: center;
  gap: 10px; padding: 16px 0 8px;
}
.modal-flag { font-size: 36px; }
.modal-sc { font-size: 36px; font-weight: 900; font-variant-numeric: tabular-nums; }
.modal-sc-sep { font-size: 24px; color: var(--text3); }
.modal-teams-lbl { text-align: center; font-size: 13px; color: var(--text2); margin-bottom: 4px; }
.modal-meta { text-align: center; font-size: 11px; color: var(--text3); padding-bottom: 12px; }

/* ── LIVE BANNER ─────────────────────────────────────────── */
/* Full-width bar that appears only when there are live matches */
.live-banner {
  display: flex; align-items: center; justify-content: space-between;
  background: rgba(217,64,64,.1); border-bottom: 1px solid rgba(217,64,64,.2);
  padding: 7px 16px;
}
.live-banner-left { display: flex; align-items: center; gap: 8px; }
.live-banner-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--red); animation: blink 1s ease infinite; flex-shrink: 0;
}
.live-banner-text { font-size: 12px; font-weight: 700; color: var(--red); letter-spacing: .3px; }
.live-banner-count {
  font-size: 11px; color: rgba(217,64,64,.7); margin-left: 2px;
}
.live-banner-refresh {
  display: flex; align-items: center; gap: 5px;
  font-size: 10px; color: var(--text3); cursor: pointer;
  padding: 4px 8px; border-radius: 4px; transition: color .12s;
}
.live-banner-refresh:active { color: var(--text2); }
.live-banner-refresh svg {
  width: 12px; height: 12px; stroke: currentColor;
  stroke-width: 2; fill: none;
}
.live-banner-refresh.spinning svg { animation: spin .6s linear infinite; }

/* last updated stamp — quiet */
.last-updated {
  font-size: 10px; color: var(--text3);
  text-align: center; padding: 4px 16px 2px;
  letter-spacing: .2px;
}

/* score flash on change */
@keyframes score-flash {
  0%   { background: rgba(217,64,64,.35); }
  100% { background: transparent; }
}
.mc-score.changed { animation: score-flash .9s ease forwards; border-radius: 4px; padding: 2px 4px; }

/* ── TOAST ───────────────────────────────────────────────── */
.toast {
  position: fixed;
  bottom: calc(var(--nav-h) + var(--safe-b) + 14px);
  left: 50%; transform: translateX(-50%);
  background: #1a2f1a; color: var(--green);
  border: 1px solid rgba(24,160,90,.3);
  padding: 9px 18px; border-radius: 6px;
  font-size: 13px; font-weight: 700; z-index: 400;
  opacity: 0; transition: opacity .2s; pointer-events: none;
  white-space: nowrap;
}
.toast.show { opacity: 1; }
.toast.err { background: #2a1515; color: var(--red); border-color: rgba(217,64,64,.3); }

/* ── EMPTY ───────────────────────────────────────────────── */
.empty { text-align: center; padding: 48px 20px; color: var(--text2); }
.empty-ico { font-size: 36px; margin-bottom: 10px; opacity: .6; }
.empty p { font-size: 13px; line-height: 1.6; }

/* ── LOADING ─────────────────────────────────────────────── */
.loading {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 56px 20px; gap: 14px;
}
.spin {
  width: 28px; height: 28px;
  border: 2px solid var(--border);
  border-top-color: var(--gold);
  border-radius: 50%; animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-t { font-size: 13px; color: var(--text2); }

/* ── UTILITIES ───────────────────────────────────────────── */
.form-section {
  background: var(--s1); border: 1px solid var(--border);
  border-radius: 8px; padding: 16px; margin-bottom: 12px;
}
</style>
</head>
<body>

<!-- HEADER -->
<header class="hdr">
  <div class="hdr-logo">🏆</div>
  <div>
    <div class="hdr-title">World Cup 2026</div>
    <div class="hdr-sub">USA · CANADA · MEXICO</div>
  </div>
  <div class="hdr-live" id="liveIndicator">
    <div class="hdr-live-dot"></div>
    LIVE
  </div>
</header>

<!-- LIVE BANNER (hidden by default) -->
<div id="liveBanner" style="position:fixed;top:var(--hdr-h);left:0;right:0;z-index:99;display:none">
  <div class="live-banner">
    <div class="live-banner-left">
      <div class="live-banner-dot"></div>
      <span class="live-banner-text">ĐANG DIỄN RA</span>
      <span class="live-banner-count" id="liveCount"></span>
    </div>
    <div class="live-banner-refresh" id="refreshBtn" onclick="manualRefresh()">
      <svg viewBox="0 0 24 24"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-4"/></svg>
      Làm mới
    </div>
  </div>
  <div class="last-updated" id="lastUpdated"></div>
</div>

<!-- CONTENT -->
<main class="content">

  <!-- TAB: LỊCH -->
  <div class="tab active" id="tab-schedule">
    <div class="chips" id="roundChips"></div>
    <div id="matchList"></div>
  </div>

  <!-- TAB: BXH -->
  <div class="tab" id="tab-standings">
    <div class="lbl">Chọn bảng</div>
    <div class="grp-grid" id="groupGrid"></div>
    <div id="standingsContent"></div>
    <div class="std-legend">
      <div class="std-leg-item"><div class="std-leg-dot" style="background:var(--green)"></div>Vào vòng 1/16</div>
      <div class="std-leg-item"><div class="std-leg-dot" style="background:var(--gold)"></div>Best 3rd</div>
      <div class="std-leg-item"><div class="std-leg-dot" style="background:var(--border)"></div>Loại</div>
    </div>
  </div>

  <!-- TAB: DỰ ĐOÁN -->
  <div class="tab" id="tab-predict">
    <div class="pred-wrap">
      <div class="info-card" style="margin-top:8px">
        <h3>🎯 Dự đoán tỉ số</h3>
        <p>Nhập tên & tỉ số trước khi trận bắt đầu.<br>Đúng tỉ số = 3 điểm · Đúng kết quả = 1 điểm</p>
      </div>
      <div class="form-section">
        <div class="field">
          <label class="field-label">Tên của bạn</label>
          <input class="inp" id="predName" type="text" placeholder="VD: Minh Tuấn" maxlength="30" autocomplete="off">
        </div>
        <div class="field">
          <label class="field-label">Chọn trận</label>
          <select class="inp" id="predMatch" onchange="onMatchSelect()">
            <option value="">— chọn trận đấu —</option>
          </select>
        </div>
        <div id="matchPreviewBox" style="display:none">
          <div class="match-preview">
            <div class="mp-team"><span id="prevHomeFlag"></span><span id="prevHomeName"></span></div>

<!-- TOAST -->

<script>
/* ── CONFIG ─────────────────────────────────────────────── */
const CONFIG = {
  USE_SAMPLE_DATA: false,
  MATCHES_CSV_URL: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRT30jgE_-36WxLhOYpo4pJgPfxZlUmC9lP8h10V9ETAvD34lGqeHJcHZbi1bsiTWPxHB5t4M5WVWkC/pub?gid=0&single=true&output=csv',
  STANDINGS_CSV_URL: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRT30jgE_-36WxLhOYpo4pJgPfxZlUmC9lP8h10V9ETAvD34lGqeHJcHZbi1bsiTWPxHB5t4M5WVWkC/pub?gid=687247927&single=true&output=csv',
  PREDICTIONS_SCRIPT_URL: 'https://script.google.com/macros/s/AKfycbxhB9jeTysnn1ykgOIGWdJoIRCC6bd-njXz_j4szizH5Xt1gIhT-nIQGeVEeN9Q7aY/exec',
};

/* ── TEAMS ──────────────────────────────────────────────── */
const TEAMS = {
  'Mexico':              { flag:'🇲🇽' }, 'Nam Phi':             { flag:'🇿🇦' },
  'Hàn Quốc':           { flag:'🇰🇷' }, 'CH Séc':              { flag:'🇨🇿' },
  'Canada':              { flag:'🇨🇦' }, 'Bosnia & Herzegovina':{ flag:'🇧🇦' },
  'Qatar':               { flag:'🇶🇦' }, 'Thụy Sĩ':            { flag:'🇨🇭' },
  'Brazil':              { flag:'🇧🇷' }, 'Morocco':             { flag:'🇲🇦' },
  'Haiti':               { flag:'🇭🇹' }, 'Scotland':            { flag:'🏴󠁧󠁢󠁳󠁣󠁴󠁿' },
  'Mỹ':                  { flag:'🇺🇸' }, 'Paraguay':            { flag:'🇵🇾' },
  'Australia':           { flag:'🇦🇺' }, 'Thổ Nhĩ Kỳ':         { flag:'🇹🇷' },
  'Đức':                 { flag:'🇩🇪' }, 'Curacao':             { flag:'🇨🇼' },
  'Bờ Biển Ngà':         { flag:'🇨🇮' }, 'Ecuador':             { flag:'🇪🇨' },
  'Hà Lan':              { flag:'🇳🇱' }, 'Nhật Bản':            { flag:'🇯🇵' },
  'Thụy Điển':           { flag:'🇸🇪' }, 'Tunisia':             { flag:'🇹🇳' },
  'Tây Ban Nha':         { flag:'🇪🇸' }, 'Cape Verde':          { flag:'🇨🇻' },
  'Saudi Arabia':        { flag:'🇸🇦' }, 'Uruguay':             { flag:'🇺🇾' },
  'Bỉ':                  { flag:'🇧🇪' }, 'Ai Cập':              { flag:'🇪🇬' },
  'Iran':                { flag:'🇮🇷' }, 'New Zealand':         { flag:'🇳🇿' },
  'Pháp':                { flag:'🇫🇷' }, 'Senegal':             { flag:'🇸🇳' },
  'Iraq':                { flag:'🇮🇶' }, 'Na Uy':               { flag:'🇳🇴' },
  'Argentina':           { flag:'🇦🇷' }, 'Algeria':             { flag:'🇩🇿' },
  'Áo':                  { flag:'🇦🇹' }, 'Jordan':              { flag:'🇯🇴' },
  'Bồ Đào Nha':          { flag:'🇵🇹' }, 'CHDC Congo':          { flag:'🇨🇩' },
  'Uzbekistan':          { flag:'🇺🇿' }, 'Colombia':            { flag:'🇨🇴' },
  'Anh':                 { flag:'🏴󠁧󠁢󠁥󠁮󠁧󠁿' }, 'Croatia':             { flag:'🇭🇷' },
  'Ghana':               { flag:'🇬🇭' }, 'Panama':              { flag:'🇵🇦' },
};

const GROUPS = { A:[],B:[],C:[],D:[],E:[],F:[],G:[],H:[],I:[],J:[],K:[],L:[] };
const MATCHES = [];

let currentRound = 'Vòng bảng';
let currentGroup = 'A';
let predictions = JSON.parse(localStorage.getItem('wc2026_preds') || '[]');

/* ── POLLING ─────────────────────────────────────────────── */
let _pollTimer = null;
let _openModalId = null;   // track which match modal is open
let _lastScores = {};        // matchId → 'hs-as' to detect changes
const POLL_LIVE  = 30_000;   // 30s when there are live matches
const POLL_IDLE  = 120_000;  // 2min otherwise

function hasLiveMatches() { return MATCHES.some(m=>m.status==='live'); }

function snapshotScores() {
  _lastScores = {};
  MATCHES.filter(m=>m.status==='live').forEach(m=>_lastScores[m.id]=`${m.hs}-${m.as}`);
}

function getChangedIds() {
  const changed=[];
  MATCHES.filter(m=>m.status==='live').forEach(m=>{
    if (_lastScores[m.id] !== `${m.hs}-${m.as}`) changed.push(m.id);
  });
  return changed;
}

function schedulePoll() {
  clearTimeout(_pollTimer);
  const delay = hasLiveMatches() ? POLL_LIVE : POLL_IDLE;
  _pollTimer = setTimeout(doRefresh, delay);
}

async function doRefresh(silent=true) {
  if (!CONFIG.MATCHES_CSV_URL || CONFIG.USE_SAMPLE_DATA) { schedulePoll(); return; }
  try {
    snapshotScores();
    const rows = await fetchCSV(CONFIG.MATCHES_CSV_URL);
    MATCHES.length=0;
    rows.forEach(r=>MATCHES.push({
      id:parseInt(r.id), round:r.round, group:r.group||null,
      home:r.home, away:r.away, date:r.date, time:r.time,
      hs:r.homeScore!==''?parseInt(r.homeScore):null,
      as:r.awayScore!==''?parseInt(r.awayScore):null,
      status:r.status||'upcoming',
    }));
    rebuildGroups();
    const changed = getChangedIds();
    updateLiveBanner();
    renderMatches(changed);
    if (document.getElementById('tab-standings').classList.contains('active')) renderStandings();
    setLastUpdated();
    initPredictSelect();
    // refresh open modal if it's a live match
    if (_openModalId !== null) openModal(_openModalId);
  } catch(e) { /* silent fail */ }
  schedulePoll();
}

async function manualRefresh() {
  const btn = document.getElementById('refreshBtn');
  btn.classList.add('spinning');
  await doRefresh(false);
  btn.classList.remove('spinning');
}

function setLastUpdated() {
  const t=new Date();
  const s=t.toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  document.getElementById('lastUpdated').textContent=`Cập nhật lúc ${s}`;
}

function updateLiveBanner() {
  const live = MATCHES.filter(m=>m.status==='live');
  const banner=document.getElementById('liveBanner');
  if (!live.length) {
    banner.style.display='none';
    document.querySelector('.content').style.paddingTop='calc(var(--hdr-h) + 4px)';
    return;
  }
  banner.style.display='block';
  document.getElementById('liveCount').textContent=`· ${live.length} trận`;
  document.querySelector('.content').style.paddingTop='calc(var(--hdr-h) + 54px)';
  // also show header live dot
  const ind=document.getElementById('liveIndicator');
  if(ind) ind.style.display='flex';
}

/* ── CSV ────────────────────────────────────────────────── */
function parseCSVLine(line) {
  const r=[]; let cur='', inQ=false;
  for (let c of line) {
    if (c==='"') inQ=!inQ;
    else if (c===',' && !inQ) { r.push(cur.trim()); cur=''; }
    else cur+=c;
  }
  r.push(cur.trim()); return r;
}
async function fetchCSV(url) {
  const proxy = location.protocol==='file:' || location.origin==='null';
  const u = proxy ? 'https://api.allorigins.win/raw?url='+encodeURIComponent(url) : url;
  const text = await (await fetch(u)).text();
  const lines = text.trim().split(/\r?\n/);
  const hdrs = parseCSVLine(lines[0]);
  return lines.slice(1).filter(l=>l.trim()).map(l => {
    const v=parseCSVLine(l), o={};
    hdrs.forEach((h,i)=> o[h]=v[i]??'');
    return o;
  });
}
function rebuildGroups() {
  Object.keys(GROUPS).forEach(k=>GROUPS[k]=[]);
  const skip = v=>!v||/^(TBD|Nhất|Nhì|Thắng|Hạng)/.test(v);
  MATCHES.filter(m=>m.group).forEach(m=>{
    if (!GROUPS[m.group]) GROUPS[m.group]=[];
    if (!skip(m.home) && !GROUPS[m.group].includes(m.home)) GROUPS[m.group].push(m.home);
    if (!skip(m.away) && !GROUPS[m.group].includes(m.away)) GROUPS[m.group].push(m.away);
  });
}

/* ── HELPERS ────────────────────────────────────────────── */
const team = n => ({ name:n, flag: TEAMS[n]?.flag||'🏳️' });
const fmtDate = d => new Date(d+'T00:00:00').toLocaleDateString('vi-VN',{weekday:'short',day:'numeric',month:'numeric'});
const getRounds = () => [...new Set(MATCHES.map(m=>m.round))];

function toast(msg, isErr=false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isErr?' err':'');
  setTimeout(()=>t.classList.remove('show'), 2400);
}

/* ── STANDINGS ──────────────────────────────────────────── */
function computeStandings(gk) {
  const teams=GROUPS[gk]||[], s={};
  teams.forEach(t=>s[t]={p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0});
  MATCHES.filter(m=>m.group===gk&&m.status==='finished').forEach(m=>{
    if(!s[m.home]||!s[m.away]) return;
    s[m.home].p++; s[m.away].p++;
    s[m.home].gf+=m.hs; s[m.home].ga+=m.as;
    s[m.away].gf+=m.as; s[m.away].ga+=m.hs;
    if(m.hs>m.as){s[m.home].w++;s[m.home].pts+=3;s[m.away].l++;}
    else if(m.hs<m.as){s[m.away].w++;s[m.away].pts+=3;s[m.home].l++;}
    else{s[m.home].d++;s[m.home].pts++;s[m.away].d++;s[m.away].pts++;}
  });
  return teams.map(t=>({code:t,...s[t]}))
    .sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf);
}

/* ── TAB NAV ────────────────────────────────────────────── */
function switchTab(name, el) {
  document.querySelectorAll('.tab').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(n=>n.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  el.classList.add('active');
  if (name==='standings') renderStandings();
  if (name==='predict') renderPredictions();
}

/* ── SCHEDULE ───────────────────────────────────────────── */
function initChips() {
  document.getElementById('roundChips').innerHTML = getRounds().map(r =>
    `<div class="chip${r===currentRound?' active':''}" onclick="setRound('${r}',this)">${r}</div>`
  ).join('');
}
function setRound(r, el) {
  currentRound=r;
  document.querySelectorAll('#roundChips .chip').forEach(c=>c.classList.remove('active'));
  el.classList.add('active'); renderMatches();
}
function renderMatches(changedIds=[]) {
  const list = MATCHES.filter(m=>m.round===currentRound);
  const byDate = {};
  list.forEach(m=>(byDate[m.date]=byDate[m.date]||[]).push(m));
  let html='';
  Object.keys(byDate).sort().forEach(d=>{
    html += `<div class="lbl">${fmtDate(d)}</div>`;
    byDate[d].forEach(m=>html+=matchCard(m, changedIds.includes(m.id)));
  });
  document.getElementById('matchList').innerHTML = html ||
    `<div class="empty"><div class="empty-ico">🗓</div><p>Chưa có trận đấu</p></div>`;
}

function statusMeta(s) {
  if (s==='live')     return `<span class="mc-status live"><span class="mc-status-dot"></span>Live</span>`;
  if (s==='finished') return `<span class="mc-status finished"><span class="mc-status-dot"></span>KT</span>`;
  return `<span class="mc-status upcoming"><span class="mc-status-dot"></span>Sắp diễn ra</span>`;
}

function matchCard(m, scoreChanged=false) {
  const h=team(m.home), a=team(m.away);
  const pCount = predictions.filter(p=>p.matchId===m.id).length;
  const badge = m.group ? `Bảng ${m.group}` : m.round;
  const liveClass = m.status==='live' ? ' is-live' : m.status==='finished' ? ' is-finished' : '';
  const flashCls = scoreChanged ? ' changed' : '';

  let scoreHTML;
  if (m.status==='upcoming') {
    scoreHTML = `<div class="mc-score-box"><span class="mc-vs">VS</span></div>`;
  } else {
    scoreHTML = `<div class="mc-score-box">
      <div class="mc-score${flashCls}">
        <span>${m.hs}</span><span class="mc-score-sep">–</span><span>${m.as}</span>
      </div>
    </div>`;
  }

  return `<div class="mc${liveClass}" onclick="openModal(${m.id})">
    <div class="mc-meta">
      <span class="mc-group">${badge}</span>
      ${statusMeta(m.status)}
      <span class="mc-time">${m.time}</span>
    </div>
    <div class="mc-body">
      <div class="mc-row">
        <div class="mc-team">
          <div class="mc-flag">${h.flag}</div>
          <div class="mc-name">${h.name}</div>
        </div>
        ${scoreHTML}
        <div class="mc-team">
          <div class="mc-flag">${a.flag}</div>
          <div class="mc-name">${a.name}</div>
        </div>
      </div>
    </div>
    <div class="mc-foot">
      <span class="mc-preds"><span class="mc-preds-icon">🎯</span>${pCount} dự đoán</span>
      ${m.status==='upcoming'?`<button class="btn-pred" onclick="event.stopPropagation();goPredict(${m.id})">Dự đoán</button>`:''}
    </div>
  </div>`;
}

/* ── STANDINGS RENDER ───────────────────────────────────── */
function initGroupGrid() {
  document.getElementById('groupGrid').innerHTML = Object.keys(GROUPS).map(k=>
    `<div class="grp-btn${k===currentGroup?' active':''}" onclick="setGroup('${k}',this)">${k}</div>`
  ).join('');
}
function setGroup(k, el) {
  currentGroup=k;
  document.querySelectorAll('.grp-btn').forEach(t=>t.classList.remove('active'));
  el.classList.add('active'); renderStandings();
}
function renderStandings() {
  const rows=computeStandings(currentGroup);
  const flags=GROUPS[currentGroup].map(t=>team(t).flag).join(' ');
  let html=`<div class="std-wrap">
    <div class="std-head">
      <span class="std-head-group">Bảng ${currentGroup}</span>
      <span class="std-head-flags">${flags}</span>
    </div>
    <table class="std"><thead><tr>
      <th>Đội</th><th>Tr</th><th>T</th><th>H</th><th>B</th><th>HS</th><th>Đ</th>
    </tr></thead><tbody>`;
  rows.forEach((r,i)=>{
    const gd=r.gf-r.ga;
    const barCls = i<2?'q':i===2?'b3':'out';
    html+=`<tr><td><div class="std-pos">
      <div class="std-bar ${barCls}"></div>
      <div class="std-team">
        <span class="std-flag">${team(r.code).flag}</span>
        <span class="std-name">${team(r.code).name}</span>
      </div></div></td>
      <td>${r.p}</td><td>${r.w}</td><td>${r.d}</td><td>${r.l}</td>
      <td style="color:${gd>0?'var(--green)':gd<0?'var(--red)':'var(--text2)'}">${gd>0?'+':''}${gd}</td>
      <td>${r.pts}</td></tr>`;
  });
  html+=`</tbody></table></div>`;
  document.getElementById('standingsContent').innerHTML=html;
}

/* ── PREDICTION ─────────────────────────────────────────── */
function initPredictSelect() {
  const upcoming=MATCHES.filter(m=>m.status==='upcoming'&&m.group);
  document.getElementById('predMatch').innerHTML=
    '<option value="">— chọn trận đấu —</option>'+
    upcoming.map(m=>{
      const h=team(m.home),a=team(m.away);
      return `<option value="${m.id}">${h.flag} ${h.name} vs ${a.name} ${a.flag} · ${fmtDate(m.date)} ${m.time}</option>`;
    }).join('');
}
function onMatchSelect() {
  const id=parseInt(document.getElementById('predMatch').value);
  const box=document.getElementById('matchPreviewBox');
  if (!id){box.style.display='none';return;}
  const m=MATCHES.find(x=>x.id===id); if (!m) return;
  const h=team(m.home),a=team(m.away);
  document.getElementById('prevHomeFlag').textContent=h.flag;
  document.getElementById('prevHomeName').textContent=h.name;
  document.getElementById('prevAwayFlag').textContent=a.flag;
  document.getElementById('prevAwayName').textContent=a.name;
  box.style.display='block';
}
function goPredict(mid) {
  switchTab('predict', document.querySelectorAll('.nav-btn')[2]);
  document.getElementById('predMatch').value=mid; onMatchSelect();
  document.getElementById('predMatch').scrollIntoView({behavior:'smooth',block:'center'});
}
function submitPrediction() {
  const name=document.getElementById('predName').value.trim();
  const mid=parseInt(document.getElementById('predMatch').value);
  const hs=document.getElementById('predHome').value;
  const as=document.getElementById('predAway').value;
  if (!name) {toast('Nhập tên của bạn trước',true);return;}
  if (!mid)  {toast('Chọn trận đấu',true);return;}
  if (hs===''||as===''){toast('Nhập tỉ số dự đoán',true);return;}
  const match=MATCHES.find(m=>m.id===mid); if (!match) return;
  const pred={name,matchId:mid,hs:parseInt(hs),as:parseInt(as),ts:Date.now()};
  const idx=predictions.findIndex(p=>p.matchId===mid&&p.name===name);
  if (idx>=0){predictions[idx]=pred;toast('✓ Đã cập nhật');}
  else {predictions.push(pred);toast('✓ Đã lưu dự đoán');}
  localStorage.setItem('wc2026_preds',JSON.stringify(predictions));
  if (CONFIG.PREDICTIONS_SCRIPT_URL) {
    const h=team(match.home),a=team(match.away);
    fetch(CONFIG.PREDICTIONS_SCRIPT_URL,{
      method:'POST',mode:'no-cors',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({name,matchId:mid,match:`${h.name} vs ${a.name}`,hs,as,ts:new Date().toISOString()})
    }).catch(()=>{});
  }
  document.getElementById('predHome').value='';
  document.getElementById('predAway').value='';
  renderPredictions();
}
function verdict(pred, match) {
  if (match.status!=='finished'||match.hs===null) return null;
  if (pred.hs===match.hs&&pred.as===match.as) return {t:'⚽ Đúng tỉ số +3',c:'correct'};
  const pr=pred.hs>pred.as?'h':pred.hs<pred.as?'a':'d';
  const rr=match.hs>match.as?'h':match.hs<match.as?'a':'d';
  return pr===rr ? {t:'✓ Đúng kết quả +1',c:'partial'} : {t:'✗ Sai',c:'wrong'};
}
function renderPredictions() {
  const wrap=document.getElementById('allPredictions');
  if (!predictions.length){
    wrap.innerHTML=`<div class="empty"><div class="empty-ico">🎯</div><p>Chưa có dự đoán nào.<br>Hãy là người đầu tiên!</p></div>`;
    return;
  }
  wrap.innerHTML=[...predictions].sort((a,b)=>b.ts-a.ts).map(p=>{
    const m=MATCHES.find(x=>x.id===p.matchId); if (!m) return '';
    const h=team(m.home),a=team(m.away),v=verdict(p,m);
    const ini=p.name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
    return `<div class="pi">
      <div class="pi-av">${ini}</div>
      <div class="pi-info">
        <div class="pi-name">${p.name}</div>
        <div class="pi-match">${h.flag} ${h.name} vs ${a.name} ${a.flag}</div>
      </div>
      <div class="pi-right">
        <div class="pi-score">${p.hs}–${p.as}</div>
        ${v?`<div class="pi-verdict ${v.c}">${v.t}</div>`:`<div class="pi-verdict pending">Chờ KQ</div>`}
      </div>
    </div>`;
  }).join('');
}

/* ── MODAL ──────────────────────────────────────────────── */
function openModal(id) {
  _openModalId = id;
  const m=MATCHES.find(x=>x.id===id); if (!m) return;
  const h=team(m.home),a=team(m.away);
  document.getElementById('modalTitle').textContent=`${h.name} vs ${a.name}`;
  document.getElementById('mHomeFlag').textContent=h.flag;
  document.getElementById('mAwayFlag').textContent=a.flag;
  const hasScore=m.status!=='upcoming';
  document.getElementById('mHomeScore').textContent=hasScore?m.hs:'';
  document.getElementById('mAwayScore').textContent=hasScore?m.as:'';
  document.getElementById('mScSep').style.display=hasScore?'':'none';
  document.getElementById('mNames').textContent=`${h.name}  ·  ${a.name}`;
  const statusTag = m.status==='live'
    ? `<span style="display:inline-flex;align-items:center;gap:5px;color:var(--red);font-size:11px;font-weight:700"><span style="width:6px;height:6px;background:var(--red);border-radius:50%;display:inline-block;animation:blink 1s infinite"></span>ĐANG DIỄN RA</span>`
    : m.status==='finished' ? `<span style="color:var(--green);font-size:11px;font-weight:700">KẾT THÚC</span>` : '';
  document.getElementById('mMeta').innerHTML=`${fmtDate(m.date)} · ${m.time} ICT ${statusTag?'· '+statusTag:''}`;
  const preds=predictions.filter(p=>p.matchId===id);
  document.getElementById('modalPredictions').innerHTML=preds.length
    ? preds.map(p=>{
        const v=verdict(p,m);
        const ini=p.name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
        return `<div class="pi">
          <div class="pi-av">${ini}</div>
          <div class="pi-info"><div class="pi-name">${p.name}</div></div>
          <div class="pi-right">
            <div class="pi-score">${p.hs}–${p.as}</div>
            ${v?`<div class="pi-verdict ${v.c}">${v.t}</div>`:''}
          </div>
        </div>`;
      }).join('')
    : `<div class="empty" style="padding:24px 0"><div class="empty-ico">🎯</div><p>Chưa có dự đoán</p></div>`;
  document.getElementById('matchModal').classList.remove('hidden');
  document.body.style.overflow='hidden';
}
function closeModal(e){if(e.target===document.getElementById('matchModal'))closeModalDirect();}
function closeModalDirect(){_openModalId=null;document.getElementById('matchModal').classList.add('hidden');document.body.style.overflow='';}

/* ── INIT ───────────────────────────────────────────────── */
async function init() {
  document.getElementById('matchList').innerHTML=
    `<div class="loading"><div class="spin"></div><div class="loading-t">Đang tải lịch thi đấu…</div></div>`;
  if (!CONFIG.USE_SAMPLE_DATA && CONFIG.MATCHES_CSV_URL) {
    try {
      const rows=await fetchCSV(CONFIG.MATCHES_CSV_URL);
      MATCHES.length=0;
      rows.forEach(r=>MATCHES.push({
        id:parseInt(r.id), round:r.round, group:r.group||null,
        home:r.home, away:r.away, date:r.date, time:r.time,
        hs:r.homeScore!==''?parseInt(r.homeScore):null,
        as:r.awayScore!==''?parseInt(r.awayScore):null,
        status:r.status||'upcoming',
      }));
      rebuildGroups();
      setLastUpdated();
    } catch(e) {
      console.error(e);
      toast('Không tải được lịch thi đấu',true);
    }
  } else { rebuildGroups(); }
  updateLiveBanner();
  initChips(); renderMatches();
  initGroupGrid(); renderStandings();
  initPredictSelect();
  schedulePoll();   // start auto-refresh cycle
}
document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
